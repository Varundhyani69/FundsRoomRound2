# frontend/nginx.conf -- serves the built SPA. Replaces nginx's default server block.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses. The JS bundle is the largest thing served here and
    # compresses to roughly a quarter of its size. Images and fonts are already
    # compressed, so they are deliberately absent from the type list.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Do not advertise the exact nginx version in the Server header.
    server_tokens off;

    # Defence-in-depth headers. The API sets its own; these cover the documents and
    # scripts nginx serves. Deliberately no Content-Security-Policy: getting one
    # right for a Vite bundle needs the real deployed origins, and a wrong CSP
    # either breaks the app or is theatre. Add it when the domain is fixed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Load balancer target. Answers without touching the filesystem and is kept out
    # of the access log, which otherwise fills with health checks every few seconds.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits hashed filenames into /assets, so the content at a given URL can
    # never change. That is what makes a one-year immutable cache safe: a new
    # deployment produces new filenames rather than new content at the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback, and the reason this file exists at all.
    #
    # React Router owns /inventory, /work-orders, /transfers and /orders on the
    # CLIENT. Those paths are not files on disk, so a visitor who reloads the page
    # on /inventory -- or arrives from a bookmark -- asks nginx for a file that does
    # not exist. Without this fallback that is a bare 404 and the app appears broken
    # on refresh while working perfectly on navigation, which is a confusing bug to
    # meet during a demo. Returning index.html lets the router resolve the path in
    # the browser.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html itself must never be cached: it is the document naming the
        # current hashed bundle, so a stale copy pins a browser to the previous
        # deployment's assets, which by then have been replaced.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
